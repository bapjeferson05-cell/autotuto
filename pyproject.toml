[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotuto"
version = "0.2.0"
requires-python = ">=3.13"
# versões travadas nas que foram testadas — é app de demo, não lib; preferimos
# "quebrou, mas do jeito que já conhecemos" a "quebrou de surpresa no dia".
dependencies = [
    "matplotlib==3.11.1",
    "numpy==2.5.3",
    "pillow==12.3.0",
    "piper-tts==1.8.0",
    "faster-whisper==1.2.1",
]

# Deps SÓ de teste — não entram no app. A regra "deps exatas" vale pro que roda
# na máquina do aluno; a bancada pode ter ferramenta que o produto não carrega.
# (pytest nunca esteve declarado: quem clonava do zero descobria na hora de
# rodar a suíte.)
[project.optional-dependencies]
test = [
    "pytest==8.4.2",
    "jsonschema==4.25.1",   # confere que o esquema do constrained decoding
                            # aceita as nossas próprias aulas de ouro
]

[tool.setuptools]
packages = ["autotuto", "autotuto.figuras"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
